# kitty config

include theme.conf

# Font
font_family      RobotoMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Window
background_opacity       0.94
window_padding_width     4
confirm_os_window_close  0
focus_follows_mouse      yes
enable_audio_bell        no

# Scrollback (-1 = infinite)
scrollback_lines -1

# Tabs
tab_bar_edge  bottom
tab_bar_style powerline

# Splits, same as terminator (ctrl+shift+o = top/bottom, ctrl+shift+e = side by side)
enabled_layouts splits,stack
map ctrl+shift+o launch --location=hsplit --cwd=current
map ctrl+shift+e launch --location=vsplit --cwd=current
map ctrl+shift+d close_window
map ctrl+shift+x toggle_layout stack

# Move between splits
map ctrl+alt+left  neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up    neighboring_window up
map ctrl+alt+down  neighboring_window down

# New tab/window keep cwd
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+n new_os_window_with_cwd
